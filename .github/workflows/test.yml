name: Test

# Runs the cross-implementation golden tests in PreviewHtmlGoldenTest.
# The tests compare the Java preview renderer + parser output against
# fixtures in `../ddot.it/test-data/cases/`, so we sibling-checkout
# Calpano/ddot.it alongside this repo. Calpano/ddot.it-syntax-tools is
# checked out too: the build copies its canonical Rouge lexer into the
# plugin resources at `generate-resources` and fails the build if the
# checkout is missing.
#
# IntelliJ's platform jars aren't published as separate Maven
# artifacts; the pom downloads the IDE zip and unpacks platform jars
# at the `initialize` phase into target/idea-lib/. The unpack is
# heavy (~1.5 GB), so we cache target/idea-lib keyed off the pom's
# <intellij.version>. Cache hit ⇒ run is ~30s; cache miss ⇒ ~3-5min.
#
# Publishing to JetBrains Marketplace is intentionally NOT wired up
# yet. Add a publish-marketplace.yml when ready.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ddot.it-intellij
    steps:
      - name: Checkout ddot.it-intellij
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ddot.it-intellij

      - name: Checkout ddot.it (test-data corpus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Calpano/ddot.it
          path: ddot.it

      - name: Checkout ddot.it-syntax-tools (canonical Rouge lexer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Calpano/ddot.it-syntax-tools
          path: ddot.it-syntax-tools

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read intellij.version from pom (for cache key)
        id: pom
        run: |
          # `-m 1` so we grab the actual <intellij.version> element and not
          # later mentions inside <!-- comment --> blocks.
          v=$(grep -m1 -E '<intellij\.version>[^<]+</intellij\.version>' pom.xml | sed -E 's/.*<intellij\.version>(.*)<\/intellij\.version>.*/\1/')
          echo "intellij_version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache target/idea-lib (IntelliJ platform jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ddot.it-intellij/target/idea-lib
          key: idea-lib-${{ steps.pom.outputs.intellij_version }}

      - name: Bootstrap IntelliJ platform jars (idempotent on cache hit)
        run: mvn -B -N initialize

      - name: Run tests
        run: mvn -B test
